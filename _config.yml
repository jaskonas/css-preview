# Site wide configuration
description: "The Center for the Study of Statesmanship promotes research, teaching, and public discussion about how statesmanship can defuse conflict and foster respectful foreign and domestic relations."
locale: en
path: feed.xml
teaser: CSS-Hero-Statesman-Philosophers.jpg
title: "Center for the Study of Statesmanship"
short_title: "CSS"
url: https://css.cua.edu

# Source snapshot this site was rebuilt from
archive: https://web.archive.org/web/20250317025935/https://css.cua.edu

# Content collections. Permalinks mirror the original WordPress URLs so old links keep working.
collections:
  news:
    output: true
    permalink: /css_news/:name/
  commentary:
    output: true
    permalink: /ideas_and_commentary/:name/
  epistulae:
    output: true
    permalink: /:name/
  humanitas:
    output: true
    permalink: /humanitas_journal/:name/
  events:
    output: true
    permalink: /event/:name/
  team:
    output: true
    permalink: /team-members/:name/

defaults:
  - scope: { type: news }
    values: { layout: post }
  - scope: { type: commentary }
    values: { layout: post }
  - scope: { type: epistulae }
    values: { layout: post }
  - scope: { type: humanitas }
    values: { layout: post }
  - scope: { type: events }
    values: { layout: event }
  - scope: { type: team }
    values: { layout: person }

# Jekyll configuration

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-extlinks

highlighter: rouge
permalink: "/:categories/:title/"
sass:
  sass_dir: _sass
  style: compressed
extlinks:
  attributes: {rel: nofollow, target: _blank}
  rel_exclude: ['css.cua.edu', 'web.archive.org']

#Site owner
name: "Center for the Study of Statesmanship"
owner:
  name: "Center for the Study of Statesmanship"
  twitter: CSSatCUA

# Contact block (footer)
contact:
  - Center for the Study of Statesmanship
  - The Catholic University of America
  - 620 Michigan Avenue, N.E.
  - 313 Caldwell Hall
  - Washington, DC 20064
contact_email: smithws@cua.edu

include:
  - .htaccess
exclude:
  - "*.less"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CLAUDE.md
  - README.md
  - node_modules
  - tmp
  - tools
