---
layout: default
---

<main id="main" role="main">
  <header class="page-banner">
    <div class="container">
      <h1>{{ page.title }}</h1>
      <p class="breadcrumbs"><a href="{{ '/' | relative_url }}">Home</a> <span aria-hidden="true">›</span> {{ page.title }}</p>
    </div>
  </header>
  <article class="page container">
    {% if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
    <div class="page-body">
      {{ content }}
    </div>
  </article>
</main>
